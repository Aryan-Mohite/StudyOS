# Render Blueprint — deploys AgenticService only. The Next.js Frontend is
# deployed separately on Vercel (see DEPLOYMENT.md); Render's free tier is
# for the Python backend, which is what actually needs a persistent
# process (Vercel's serverless model doesn't fit LangGraph/FastAPI well).
#
# Native Python runtime, not Docker: the only thing that ever required
# Docker here was installing the tesseract-ocr system binary for the OCR
# PDF-extraction fallback. That fallback was dropped (see
# App/services/pdf_service.py) — pdfplumber + PyMuPDF now handle text-based
# PDFs, and Render's native Python runtime can't install OS packages, so
# there's nothing left needing a container.
#
# Usage: Render dashboard -> New -> Blueprint -> point at this repo.
# Render finds this file automatically at the repo root.
#
# Env vars marked `sync: false` are secrets — Render will prompt for them
# in the dashboard rather than committing values here.

services:
  - type: web
    name: studyos-agentic
    runtime: python
    plan: free
    rootDir: AgenticService
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production

      # -- LLM provider (pick one; only its key is required for text gen) --
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: llama-3.3-70b-versatile
      # GEMINI_API_KEY is required even if LLM_PROVIDER stays "groq" — RAG
      # embeddings always run via the Gemini API now (free tier, no card:
      # https://aistudio.google.com/apikey). See rag_service.py.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.0-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL_NAME
        value: claude-sonnet-4-6

      # -- CORS: set to your Vercel URL(s) after the Frontend is deployed --
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000

      # -- Qdrant Cloud (RAG vector store) --
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_LOCAL_PATH
        value: vector_db

      # -- Service-to-service auth (must exactly match Frontend's
      #    INTERNAL_SERVICE_JWT_SECRET) --
      - key: INTERNAL_SERVICE_JWT_SECRET
        sync: false
